    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        { "@type": "Question", "name": "What is the AFF?", "acceptedAnswer": { "@type": "Answer", "text": "The AFF (Affirmative) supports the resolution by arguing that its central claim is morally or practically true. They carry the burden of proof, using a framework of values and contentions to demonstrate why the resolution should be adopted." } },
        { "@type": "Question", "name": "What is the NEG?", "acceptedAnswer": { "@type": "Answer", "text": "The NEG (Negative) opposes the resolution by refuting the Affirmative’s arguments or providing independent reasons why the resolution is harmful. They aim to create enough doubt or counter-evidence to prove that the resolution should be rejected." } },
        { "@type": "Question", "name": "What is Lincoln-Douglas (LD) debate?", "acceptedAnswer": { "@type": "Answer", "text": "LD is a one-on-one debate format focusing on philosophical values and criteria. It traditionally clashes on moral imperatives, though modern 'circuit' LD includes policy-style plans and kritiks." } },
        { "@type": "Question", "name": "What is Policy debate?", "acceptedAnswer": { "@type": "Answer", "text": "Policy debate involves two-on-two teams debating a government's course of action. It is highly technical, evidence-intensive, and focuses on pragmatism and structural outcomes." } },
        { "@type": "Question", "name": "What is a 'flow' in debate?", "acceptedAnswer": { "@type": "Answer", "text": "Flowing is the specialized form of note-taking used by debaters to track the evolution of every argument throughout a round, usually organized in columns by speech." } },
        { "@type": "Question", "name": "What is a Kritik (K)?", "acceptedAnswer": { "@type": "Answer", "text": "A Kritik is a type of argument that challenges the philosophical, ethical, or linguistic assumptions of an opponent's case or the resolution itself. It often focuses on systemic issues like capitalism, racism, or biopower." } },
        { "@type": "Question", "name": "What is a Counterplan (CP)?", "acceptedAnswer": { "@type": "Answer", "text": "A Counterplan is a competitive alternative to the Affirmative plan proposed by the Negative. To win, the Neg must prove the CP is better than the plan and that you cannot or should not do both (mutual exclusivity)." } },
        { "@type": "Question", "name": "What is Topicality (T)?", "acceptedAnswer": { "@type": "Answer", "text": "Topicality is a procedural argument made by the Negative claiming the Affirmative plan does not fall within the definition of the resolution. It is a 'voting issue' because it affects fairness and education." } },
        { "@type": "Question", "name": "What is Theory?", "acceptedAnswer": { "@type": "Answer", "text": "Theory arguments are meta-debates about the rules of the round. Debaters use theory to claim that an opponent's specific style or argument (like 'multiple conditional counterplans') is unfair and should be penalized." } },
        { "@type": "Question", "name": "What are 'Tricks'?", "acceptedAnswer": { "@type": "Answer", "text": "Tricks are a subset of LD arguments that rely on hidden logical 'spikes' or paradoxes designed to be missed by an opponent, leading to an automatic win if conceded." } },
        { "@type": "Question", "name": "What is 'Spreading'?", "acceptedAnswer": { "@type": "Answer", "text": "Spreading (speed reading) is a technique used to deliver arguments at a high rate of words-per-minute to maximize the amount of evidence and logic introduced in a limited speech time." } },
        { "@type": "Question", "name": "What is Disclosure?", "acceptedAnswer": { "@type": "Answer", "text": "Disclosure is the practice of posting your evidence and case citations on the official Wiki (Tabroom/Opencaselist) before a round to allow for better-prepared, higher-level technical clashes." } },
        { "@type": "Question", "name": "What is a Permutation?", "acceptedAnswer": { "@type": "Answer", "text": "A permutation (perm) is an Affirmative test of competitiveness against a Negative counterplan or kritik. It argues that the plan and the alternative can be done simultaneously, meaning the alternative isn't a reason to vote Neg." } },
        { "@type": "Question", "name": "What is 'Impact Turning'?", "acceptedAnswer": { "@type": "Answer", "text": "An impact turn is when you argue that the 'bad' thing your opponent claims will happen is actually a 'good' thing (or vice-versa). For example, arguing that 'economic growth' is actually harmful due to environmental destruction." } }
      ]
    }
    </script>

            try {
                var stored = localStorage.getItem("d1.theme");
                var system = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
                document.documentElement.setAttribute("data-theme", stored || system);
            } catch (e) {
                document.documentElement.setAttribute("data-theme", "light");
            }
        })();
