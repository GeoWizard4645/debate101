name: Deploy to GitHub Pages

# Builds the site and deploys to GitHub Pages, writing config.js at deploy
# time so runtime configuration is never committed to source control.
#
# ONE-TIME SETUP (do this once in repo settings):
#   1. Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#   2. Settings -> Secrets and variables -> Actions -> Variables: add
#      GROQ_WORKER_URL with the URL printed by `wrangler deploy` (see
#      worker/README.md). This value is the public Worker endpoint, not a
#      secret — the Groq API key lives only in the Worker.
#   3. The old GEMINI_API_KEY repo secret can be deleted; nothing reads it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; in-progress runs are cancelled.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # config.js carries the public Worker endpoint that src/lib/ai.js reads.
      # It is written here rather than committed because config.js is
      # gitignored (it historically held an API key, and keeping the whole
      # file out of the repo keeps that habit safe).
      - name: Write config.js
        env:
          GROQ_WORKER_URL: ${{ vars.GROQ_WORKER_URL }}
        run: |
          if [ -z "${GROQ_WORKER_URL}" ]; then
            echo "::warning::No GROQ_WORKER_URL repo variable set — AI chat will not work until it is."
          fi
          cat > config.js <<EOF
          // Auto-generated at deploy time by .github/workflows/deploy.yml.
          // Public endpoint only — never put a key in this file.
          window.DEBATE101_AI_ENDPOINT = "${GROQ_WORKER_URL}";
          EOF
          echo "Wrote config.js ($(wc -c < config.js) bytes)"

      # The main site is a Vite + React app and needs a build. Cascade (/flow)
      # and the standalone tools (/tools) are plain static apps — vite.config.js
      # copies them into dist/ untouched, so nothing about them changed and
      # they are never processed by the bundler.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Verify the static apps survived the build
        run: |
          for path in dist/flow/index.html dist/tools/card-cutter/index.html \
                      dist/tools/speed-trainer/index.html dist/tools/round-tracker/index.html \
                      dist/data/content.json dist/CNAME dist/config.js; do
            if [ ! -f "$path" ]; then
              echo "::error::$path is missing from the build output."
              exit 1
            fi
          done
          echo "All passthrough apps and files present."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The built site, not the repo root.
          path: 'dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
